<div class="character-card" (click)="onCardClick()">
  <div class="image-wrapper">
    <img
      [src]="character.image"
      [alt]="character.name"
      loading="lazy"
      class="character-image"
    />
    <button
      type="button"
      class="fav-btn"
      [class.active]="isFavorite"
      [attr.aria-label]="isFavorite ? 'Remove from favorites' : 'Add to favorites'"
      (click)="onToggleFavorite($event)"
    >
      <svg
        viewBox="0 0 24 24"
        fill="currentColor"
        class="heart-icon"
      >
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </button>
    <div class="species-badge">{{ character.species }}</div>
  </div>

  <div class="card-body">
    <div class="card-header">
      <h3 class="character-name" [title]="character.name">{{ character.name }}</h3>
      <div class="status-indicator">
        <span class="status-dot" [ngClass]="character.status | statusColor"></span>
        <span class="status-label">{{ character.status }}</span>
      </div>
    </div>

    <div class="card-meta">
      <div class="meta-row">
        <span class="meta-label">Gender:</span>
        <span class="meta-value">{{ character.gender }}</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Last known:</span>
        <span class="meta-value text-truncate" [title]="character.location.name">{{ character.location.name }}</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Origin:</span>
        <span class="meta-value text-truncate" [title]="character.origin.name">{{ character.origin.name }}</span>
      </div>
    </div>

    <div class="card-footer">
      <span class="episodes-count">
        📺 {{ character.episode.length }} {{ character.episode.length === 1 ? 'episode' : 'episodes' }}
      </span>
      <span class="view-details-link">Details →</span>
    </div>
  </div>
</div>
